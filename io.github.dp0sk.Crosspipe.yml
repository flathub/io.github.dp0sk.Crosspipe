app-id: io.github.dp0sk.Crosspipe
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: crosspipe

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  - --filesystem=xdg-run/pipewire-0

modules:

  - name: crosspipe
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/dp0sk/Crosspipe.git
        commit: 43c626119f0c2fd2a0eabf9f0698f43bf467cb3d
